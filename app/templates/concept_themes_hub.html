<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #1c1917;
      --muted: #57534e;
      --line: #d6d3d1;
      --card: #fffdf8;
      --a: #1e3a8a;
      --b: #92400e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Noto Sans SC", sans-serif;
      background:
        radial-gradient(circle at top left, #e7e5e4 0, transparent 40%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 2.5rem;
    }
    a.back {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.92rem;
    }
    h1 {
      margin: 0.6rem 0 0.35rem;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
    }
    .meta {
      color: var(--muted);
      margin: 0 0 0.75rem;
      line-height: 1.5;
    }
    .slider {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.35rem 0.85rem;
      align-items: center;
      margin: 0 0 1rem;
      padding: 0.75rem 0.9rem;
      background: var(--card);
      border: 1px solid var(--line);
    }
    .slider strong { font-variant-numeric: tabular-nums; }
    .slider input { width: 100%; accent-color: #1d4ed8; }
    .slider .ends {
      grid-column: 2;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .theme-card {
      margin: 0 0 1rem;
      padding: 1rem 1.1rem 1.05rem;
      background: var(--card);
      border: 1px solid var(--line);
    }
    .theme-card .head {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      align-items: baseline;
      justify-content: space-between;
      margin: 0 0 0.45rem;
    }
    .theme-card h2 {
      margin: 0;
      font-size: 1.15rem;
    }
    .theme-card h2 a {
      color: #1d4ed8;
      text-decoration: none;
    }
    .theme-card h2 a:hover { text-decoration: underline; }
    .theme-card .kind {
      margin: 0;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0 0 0.55rem;
    }
    .badge {
      flex: 1 1 10rem;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--line);
      border-left: 3px solid var(--line);
      font-size: 0.88rem;
    }
    .badge.a { border-left-color: var(--a); }
    .badge.ab { border-left-color: var(--b); }
    .badge .label { font-weight: 600; margin: 0; }
    .badge .detail {
      margin: 0.2rem 0 0;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.4;
    }
    .badge .sub {
      margin-left: 0.3rem;
      font-weight: 500;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .chart {
      border: 1px solid var(--line);
      padding: 0.25rem;
      background: #fffdf8;
    }
    .empty {
      padding: 1.5rem 1rem;
      color: var(--muted);
    }
  </style>
  <script charset="utf-8" src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
  <main>
    <a class="back" href="{{ back_href }}">← {{ back_label }}</a>
    <h1>{{ title }}</h1>
    {% if as_of and dates %}
    <div class="slider">
      <strong id="slider-date">{{ as_of }}</strong>
      <input
        id="date-slider"
        type="range"
        min="0"
        max="{{ dates|length - 1 }}"
        value="{{ dates|length - 1 }}"
        step="1"
        aria-label="交易日期"
      >
      <div class="ends">
        <span>{{ dates[0] }}</span>
        <span>{{ dates[-1] }}</span>
      </div>
    </div>
    {% endif %}
    <p class="meta" id="hub-meta"></p>
    <div id="hub-body"></div>
  </main>
  <script>
    const dates = {{ dates | tojson }};
    const hubApi = {{ hub_api | tojson }};
    const initial = {{ initial | tojson }};
    const slider = document.getElementById("date-slider");
    const dateLabel = document.getElementById("slider-date");
    const meta = document.getElementById("hub-meta");
    const body = document.getElementById("hub-body");

    function remountScripts(root) {
      root.querySelectorAll("script").forEach((oldScript) => {
        const script = document.createElement("script");
        if (oldScript.src) {
          script.src = oldScript.src;
          script.async = false;
        } else {
          script.text = oldScript.textContent;
        }
        oldScript.replaceWith(script);
      });
    }

    function renderHub(data) {
      if (data.empty_message && !(data.themes && data.themes.length)) {
        body.innerHTML = `<p class="empty">${data.empty_message}</p>`;
        return;
      }
      const cards = (data.themes || []).map((theme) => {
        const abSub = theme.badge_ab && theme.badge_ab.sublabel
          ? `<span class="sub">${theme.badge_ab.sublabel}</span>`
          : "";
        const badgeA = theme.badge_a
          ? `<div class="badge a">
              <p class="label">${theme.badge_a.label || ""}</p>
              <p class="detail">${theme.badge_a.detail || ""}</p>
            </div>`
          : "";
        const badgeAb = theme.badge_ab
          ? `<div class="badge ab">
              <p class="label">${theme.badge_ab.label || ""}${abSub}</p>
              <p class="detail">${theme.badge_ab.detail || ""}</p>
            </div>`
          : "";
        const chart = theme.empty_message
          ? `<p class="empty">${theme.empty_message}</p>`
          : `<div class="chart">${theme.group_chart_html || ""}</div>`;
        return `
          <section class="theme-card">
            <div class="head">
              <h2><a href="${theme.href}">${theme.title} →</a></h2>
              <p class="kind">${theme.group_a_label || ""} ↔ ${theme.group_b_label || ""}</p>
            </div>
            <div class="badges">${badgeA}${badgeAb}</div>
            ${chart}
          </section>`;
      }).join("");
      body.innerHTML = cards || `<p class="empty">暂无主题域</p>`;
      remountScripts(body);
    }

    async function loadDate(index) {
      if (!dates || !dates.length) return;
      const day = dates[index];
      dateLabel.textContent = day;
      meta.textContent = "加载中…";
      const response = await fetch(`${hubApi}?as_of=${encodeURIComponent(day)}`);
      if (!response.ok) {
        meta.textContent = "加载失败";
        return;
      }
      const data = await response.json();
      meta.textContent = data.meta_line || "";
      renderHub(data);
    }

    if (slider) {
      slider.addEventListener("input", () => {
        loadDate(Number(slider.value));
      });
    }

    meta.textContent = initial.meta_line || "";
    renderHub(initial);
  </script>
</body>
</html>
